# render.yaml — Render deployment configuration for Apicore-backend
# https://render.com/docs/render-yaml-spec
#
# Database: Supabase PostgreSQL (external)
# Set DATABASE_URL in the Render Dashboard → Environment to the Supabase connection string.

services:
  - type: web
    name: apicore-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false           # Set manually after deploying frontend
      - key: DATABASE_URL
        sync: false           # Set manually to Supabase connection string
