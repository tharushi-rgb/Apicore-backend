# render.yaml — Render deployment configuration for Apicore-backend
# https://render.com/docs/render-yaml-spec
#
# ⚠️  SQLite note: Render's free tier does NOT have persistent disk.
#     Your data will be wiped on every deploy.
#     For a persistent database, either:
#       a) Add a Render Persistent Disk (paid) and set DATABASE_PATH=/data/apicore.db
#       b) Migrate to Render's managed PostgreSQL (requires schema changes)
#     For a demo / development deployment the default SQLite setup is fine.

databases:
  - name: apicore-db
    plan: free
    databaseName: apicore
    user: apicore_user

services:
  - type: web
    name: apicore-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false           # Set manually after deploying frontend
      - key: DATABASE_URL
        fromDatabase:
          name: apicore-db
          property: connectionString
